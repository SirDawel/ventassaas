    <!-- Título del Reporte -->
    <div class="report-title-box">
        <div class="report-title">📊 REPORTE DE VENTAS</div>
        <div class="report-subtitle">{{ titulo_periodo }}</div>
        
        <div class="report-meta">
            <div class="meta-item">
                <div class="meta-label">📅 Fecha de Generación</div>
                <div class="meta-value">{{ fecha_actual|date:"d/m/Y H:i" }}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">👤 Generado Por</div>
                <div class="meta-value">{{ usuario }}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">📊 Período Analizado</div>
                <div class="meta-value">{{ fecha_inicio|date:"d/m/Y" }} - {{ fecha_fin|date:"d/m/Y" }}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">📄 Tipo de Reporte</div>
                <div class="meta-value">Ventas Detallado</div>
            </div>
        </div>
    </div>
    
    <!-- Información del Reporte -->
    <div class="header-box">
        <div class="info-cards-grid">
            <div class="info-card info-card-primary">
                <div class="info-card-label">🎯 Objetivo del Reporte</div>
                <div class="info-card-value">Análisis de Ventas y Facturación</div>
            </div>
            <div class="info-card info-card-success">
                <div class="info-card-label">✅ Estado del Sistema</div>
                <div class="info-card-value">Operativo y Actualizado</div>
            </div>
            <div class="info-card info-card-warning">
                <div class="info-card-label">📈 Nivel de Detalle</div>
                <div class="info-card-value">Completo con Métricas</div>
            </div>
        </div>
    </div>

    <!-- Resumen de Totales -->
    <div class="totales-resumen">
        <table>
            <tr>
                <td class="totales-highlight">
                    <span class="totales-label">💰 Ventas</span><br>
                    <span class="totales-valor">RD${{ total_ventas|floatformat:2 }}</span>
                </td>
                <td class="totales-success">
                    <span class="totales-label">✅ Cobrado</span><br>
                    <span class="totales-valor">RD${{ total_cobrado|floatformat:2 }}</span>
                </td>
                <td class="totales-warning">
                    <span class="totales-label">⚠️ ITBIS</span><br>
                    <span class="totales-valor">RD${{ total_impuestos|floatformat:2 }}</span>
                </td>
                <td class="totales-info">
                    <span class="totales-label">📋 Facturas</span><br>
                    <span class="totales-valor">{{ total_facturas }}</span>
                </td>
                <td>
                    <span class="totales-label">📊 Promedio</span><br>
                    <span class="totales-valor">RD${{ promedio_venta|floatformat:2 }}</span>
                </td>
                <td class="totales-danger">
                    <span class="totales-label">🏷️ Descuentos</span><br>
                    <span class="totales-valor">RD${{ total_descuentos|floatformat:2 }}</span>
                </td>
            </tr>
        </table>
    </div>

    <!-- Desglose por Estado -->
    <div class="section-title">📊 Desglose de Facturas por Estado</div>
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">Estado</th>
                <th style="width: 15%;" class="text-center">Cantidad</th>
                <th style="width: 20%;" class="text-right">Monto Total</th>
                <th style="width: 15%;" class="text-right">% del Total</th>
                <th style="width: 25%;" class="text-center">Indicador Visual</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><span class="badge badge-success">✅ PAGADAS</span></td>
                <td class="text-center text-bold">{{ facturas_pagadas }}</td>
                <td class="text-right text-bold text-success">RD${{ total_cobrado|floatformat:2 }}</td>
                <td class="text-right text-bold">{{ tasa_pago|floatformat:1 }}%</td>
                <td class="text-center">
                    <div style="background: linear-gradient(to right, #11998e 0%, #38ef7d {{ tasa_pago|floatformat:0 }}%, #e5e7eb {{ tasa_pago|floatformat:0 }}%); height: 20px; border-radius: 10px; width: 100%;"></div>
                </td>
            </tr>
            <tr>
                <td><span class="badge badge-warning">⏳ PAGO PARCIAL</span></td>
                <td class="text-center text-bold">{{ facturas_parciales }}</td>
                <td class="text-right">-</td>
                <td class="text-right">-</td>
                <td class="text-center" style="color: #f59e0b;">En proceso</td>
            </tr>
            <tr>
                <td><span class="badge badge-info">⏰ PENDIENTES</span></td>
                <td class="text-center text-bold">{{ facturas_pendientes }}</td>
                <td class="text-right text-bold text-danger">RD${{ total_pendiente_cobro|floatformat:2 }}</td>
                <td class="text-right text-bold">{{ pendiente_porcentaje|default:"0"|floatformat:1 }}%</td>
                <td class="text-center" style="color: #4facfe;">Por cobrar</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>TOTAL GENERAL</td>
                <td class="text-center text-bold">{{ total_facturas }}</td>
                <td class="text-right text-bold">RD${{ total_ventas|floatformat:2 }}</td>
                <td class="text-right text-bold">100%</td>
                <td class="text-center">-</td>
            </tr>
        </tfoot>
    </table>

    <!-- Análisis Financiero Detallado -->
    <div class="section-title">💵 Análisis Financiero Detallado</div>
    <table class="analysis-grid">
        <tr>
            <td>
                <div class="analysis-card">
                    <div class="analysis-card-header">💰 Composición de Ingresos</div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Productos</span>
                        <span class="analysis-item-value text-success">RD${{ ingresos_productos|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Servicios/Conceptos</span>
                        <span class="analysis-item-value text-info">RD${{ ingresos_servicios|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Mensualidades</span>
                        <span class="analysis-item-value">RD${{ ingresos_mensualidades|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item highlight-row">
                        <span class="analysis-item-label">ITBIS (18%)</span>
                        <span class="analysis-item-value text-itbis">RD${{ total_impuestos|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item highlight-negative">
                        <span class="analysis-item-label">Descuentos Aplicados</span>
                        <span class="analysis-item-value text-danger">-RD${{ total_descuentos|floatformat:2 }}</span>
                    </div>
                </div>
            </td>
            <td>
                <div class="analysis-card">
                    <div class="analysis-card-header">💳 Métodos de Pago</div>
                    {% if ventas_por_metodo %}
                        {% for metodo in ventas_por_metodo %}
                        <div class="analysis-item">
                            <span class="analysis-item-label">
                                {% if metodo.metodo_pago == 'efectivo' %}💵 Efectivo
                                {% elif metodo.metodo_pago == 'tarjeta' %}💳 Tarjeta
                                {% elif metodo.metodo_pago == 'transferencia' %}🏦 Transferencia
                                {% elif metodo.metodo_pago == 'cheque' %}📄 Cheque
                                {% elif metodo.metodo_pago == 'mixto' %}🔀 Mixto
                                {% else %}{{ metodo.metodo_pago }}
                                {% endif %}
                            </span>
                            <span class="analysis-item-value">RD${{ metodo.total|floatformat:2 }}</span>
                        </div>
                        {% endfor %}
                    {% else %}
                        <div class="analysis-item">
                            <span class="analysis-item-label">Sin datos</span>
                            <span class="analysis-item-value">-</span>
                        </div>
                    {% endif %}
                </div>
            </td>
            <td>
                <div class="analysis-card">
                    <div class="analysis-card-header">📈 Tendencia y Comparación</div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Ventas Período Actual</span>
                        <span class="analysis-item-value">RD${{ total_ventas|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Ventas Período Anterior</span>
                        <span class="analysis-item-value">RD${{ total_ventas_anterior|floatformat:2 }}</span>
                    </div>
                    <div class="analysis-item {% if variacion_porcentual >= 0 %}highlight-positive{% else %}highlight-negative{% endif %}">
                        <span class="analysis-item-label">Variación</span>
                        <span class="analysis-item-value" style="color: {% if variacion_porcentual >= 0 %}#22c55e{% else %}#ef4444{% endif %};">
                            {% if variacion_porcentual >= 0 %}⬆ +{% else %}⬇ {% endif %}{{ variacion_porcentual|floatformat:1 }}%
                        </span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Tasa de Cobro</span>
                        <span class="analysis-item-value text-success">{{ tasa_pago|floatformat:1 }}%</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-item-label">Pendiente por Cobrar</span>
                        <span class="analysis-item-value text-danger">RD${{ total_pendiente_cobro|floatformat:2 }}</span>
                    </div>
                </div>
            </td>
        </tr>
    </table>

    <div class="section-title">🏆 Artículos Más Vendidos - TOP 10</div>
    <table>
        <thead>
            <tr>
                <th style="width: 8%;" class="text-center">Ranking</th>
                <th style="width: 15%;">Código</th>
                <th style="width: 27%;">Nombre del Artículo</th>
                <th style="width: 10%;" class="text-center">Unidades</th>
                <th style="width: 12%;" class="text-right">Precio Prom.</th>
                <th style="width: 10%;" class="text-right">ITBIS</th>
                <th style="width: 18%;" class="text-right">Total Ingresos</th>
            </tr>
        </thead>
        <tbody>
            {% for articulo in top_articulos %}
            <tr>
                <td class="text-center">
                    <span class="rank-icon rank-{% if forloop.counter <= 3 %}{{ forloop.counter }}{% else %}other{% endif %}">
                        #{{ forloop.counter }}
                    </span>
                </td>
                <td><strong>{{ articulo.articulo__codigo_barras }}</strong></td>
                <td>{{ articulo.articulo__nombre }}</td>
                <td class="text-center text-bold" style="color: #667eea;">{{ articulo.total_vendido|floatformat:0 }}</td>
                <td class="text-right">RD${{ articulo.precio_promedio|default:"0.00"|floatformat:2 }}</td>
                <td class="text-right text-itbis">RD$0.00</td>
                <td class="text-right text-bold text-success">RD${{ articulo.ingresos|floatformat:2 }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td colspan="6" class="text-right">TOTAL PRODUCTOS:</td>
                <td class="text-right text-bold">RD${{ ingresos_productos|floatformat:2 }}</td>
            </tr>
        </tfoot>
    </table>
    {% endif %}

    <!-- Top Conceptos/Servicios -->
    {% if top_conceptos %}
    <div class="section-title">🎯 Conceptos y Servicios Más Facturados - TOP 10</div>
    <table>
        <thead>
            <tr>
                <th style="width: 8%;" class="text-center">Ranking</th>
                <th style="width: 40%;">Descripción del Concepto</th>
                <th style="width: 15%;">Tipo</th>
                <th style="width: 10%;" class="text-center">Cantidad</th>
                <th style="width: 12%;" class="text-right">Precio Prom.</th>
                <th style="width: 15%;" class="text-right">Total Ingresos</th>
            </tr>
        </thead>
        <tbody>
            {% for concepto in top_conceptos %}
            <tr>
                <td class="text-center">
                    <span class="rank-icon rank-{% if forloop.counter <= 3 %}{{ forloop.counter }}{% else %}other{% endif %}">
                        #{{ forloop.counter }}
                    </span>
                </td>
                <td><strong>{{ concepto.concepto__nombre }}</strong></td>
                <td>
                    {% if concepto.concepto__tipo == 'mensualidad' %}
                    <span class="badge badge-info">💵 Mensualidad</span>
                    {% elif concepto.concepto__tipo == 'inscripcion' %}
                    <span class="badge badge-warning">📝 Inscripción</span>
                    {% else %}
                    <span class="badge badge-info">{{ concepto.concepto__tipo|title }}</span>
                    {% endif %}
                </td>
                <td class="text-center text-bold" style="color: #667eea;">{{ concepto.cantidad_ventas }}</td>
                <td class="text-right">RD${{ concepto.precio_promedio|default:"0.00"|floatformat:2 }}</td>
                <td class="text-right text-bold text-success">RD${{ concepto.ingresos|floatformat:2 }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5" class="text-right">TOTAL SERVICIOS:</td>
                <td class="text-right text-bold">RD${{ ingresos_servicios|floatformat:2 }}</td>
            </tr>
        </tfoot>
    </table>
    {% endif %}

    <!-- Footer -->
    <div class="footer-info">
        <p style="margin: 0; font-weight: 700;">
            🔒 Documento Confidencial - Sistema de Gestión Escolar | 
            Generado el {{ fecha_actual|date:"d/m/Y" }} a las {{ fecha_actual|date:"H:i" }} | 
            Usuario: {{ usuario }} | 
            © {{ fecha_actual|date:"Y" }} Todos los derechos reservados
        </p>
    </div>
</body>
</html>
