{% extends 'website/base.html' %}

{% block title %}Código de Seguridad{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4><i class="fas fa-key me-2"></i>Ingrese el Código de Seguridad</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="get">
                        <input type="hidden" name="copiar_factura" value="{{ copiar_factura_id }}">
                        <div class="mb-3">
                            <label for="codigo_intento" class="form-label">Código de Seguridad</label>
                            <input type="text" class="form-control" id="codigo_intento" name="codigo_intento" required maxlength="10" autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check me-1"></i>Validar Código
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
