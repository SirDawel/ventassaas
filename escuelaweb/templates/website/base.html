{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio Web{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'img/logofavicon.png' %}">
    <link rel="shortcut icon" type="image/jpeg" href="{% static 'img/logofavicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/logofavicon.png' %}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'website/header.html' %}

    <!-- Contenedor de mensajes Toast -->
    {% if messages %}
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999; max-width: 350px;">
        {% for message in messages %}
        <div class="toast align-items-center text-white bg-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %} border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'warning' %}exclamation-triangle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %} me-2"></i>
                    {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <style>
        body {
            /*background-image:
                /*linear-gradient(rgba(50, 50, 50, 0.5), rgba(50, 50, 50, 0.5)),*/
                /*url("/static/img/fondo2do.jpg");*/
                /*url("{% static 'img/fondo2do.jpg' %}");*/
            background-color: rgb(240, 238, 232);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-blend-mode: darken;
            color: white;
        }
    </style>
    
    <main>
        {% block content %}
        <!-- Contenido dinámico de cada página -->
        {% endblock %}
    </main>

    {% include 'website/footer.html' %}
    
    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        // Auto-mostrar y ocultar toasts
        document.addEventListener('DOMContentLoaded', function() {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'));
            var toastList = toastElList.map(function(toastEl) {
                return new bootstrap.Toast(toastEl, {
                    autohide: true,
                    delay: 5000
                });
            });
            toastList.forEach(toast => toast.show());
        });

        // Script de cierre por inactividad
        let tiempoInactividad = 59 * 60 * 1000; // 59 minutos
        let temporizador;

        function reiniciarTemporizador() {
            clearTimeout(temporizador);
            temporizador = setTimeout(cerrarSesion, tiempoInactividad);
        }

        function cerrarSesion() {
            alert("Tu sesión ha expirado por inactividad.");
            window.location.href = "/logout/";
        }

        window.onload = reiniciarTemporizador;
        document.onmousemove = reiniciarTemporizador;
        document.onkeypress = reiniciarTemporizador;
    </script>
</body>
</html>
