{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .card {
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .btn-outline-secondary {
            border-left: none;
        }

        @media (max-width: 576px) {
            .card {
                margin: 1rem;
                padding: 1rem;
            }
            .card-title {
                font-size: 1.3rem;
            }
            label, input, button {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <h4 class="card-title text-center mb-3">🔑 Restablecer Contraseña</h4>

                {% if valid %}
                <form method="POST" action="{% url 'password_reset_confirm' uidb64=uid token=token %}">
                    {% csrf_token %}

                    <!-- Campo Nueva Contraseña -->
                    <div class="mb-3 position-relative">
                        <label for="password" class="form-label">Nueva contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="form-control" placeholder="Nueva contraseña" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Campo Confirmar Contraseña -->
                    <div class="mb-3 position-relative">
                        <label for="confirm_password" class="form-label">Confirmar contraseña</label>
                        <div class="input-group">
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirmar contraseña" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirm_password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Cambiar Contraseña</button>
                </form>
                {% else %}
                <div class="alert alert-danger mt-3" role="alert">
                    Este enlace ha expirado o es inválido.
                </div>
                {% endif %}

                {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                    <div class="alert alert-info text-center py-2" role="alert">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <!-- Script para mostrar/ocultar contraseñas -->
    <script>
    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector("i");
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        icon.classList.toggle("bi-eye");
        icon.classList.toggle("bi-eye-slash");
    }
    </script>
</body>
</html>
