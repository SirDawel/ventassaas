{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .signup-card {
            max-width: 500px;
            margin: auto;
            margin-top: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Signup Card -->
        <div class="card signup-card">
            <div class="card-body">
                <h5 class="card-title text-center mb-4">Sign Up</h5>
                {% if messages %}
                {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}

                <!-- Registro temporalmente deshabilitado -->
                <form method="POST" action="#">
                    {% csrf_token %}
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="signupFirstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="signupFirstName" name="firstname" value="{{ firstname }}"
                            placeholder="Enter your first name" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupLastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="signupLastName" name="lastname" value="{{ lastname }}"
                            placeholder="Enter your last name" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="signupEmail" name="email" value="{{ email }}"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="signupPassword" name="password"
                            placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="signupConfirmPassword" name="confirm_password"
                            placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Create Account</button>
                </form>

                <hr>
                <div class="text-center">
                    <p>Already have an account? <a href="{% url 'login' %}" class="text-primary">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
