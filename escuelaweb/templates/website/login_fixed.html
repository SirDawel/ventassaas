{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .login-card {
            max-width: 600px;
            margin: auto;
            margin-top: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Card -->
        <div class="card login-card">
            <div class="card-body">
                <h5 class="card-title text-center mb-4">Logearse</h5>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                                
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="exampleDropdownFormEmail1" class="form-label">Correo Electronico</label>
                        <input type="email" class="form-control" id="exampleDropdownFormEmail1" name="email" placeholder="email@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="exampleDropdownFormPassword1" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="exampleDropdownFormPassword1" name="password" placeholder="Password">
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="dropdownCheck">
                            <label class="form-check-label" for="dropdownCheck">
                                Recuerdar Usuario
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Logearse</button>
                </form>
                <hr>
                <div class="text-center">
		    <!--<a href="{% url 'register'%}" class="d-block">Nuevo por Aqui? Registrate</a> --> 
                    <a href="#" class="d-block">Nuevo por Aqui? Registrate</a>
                    <a href="{% url 'password_reset'%}" class="d-block">Olvidates tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
