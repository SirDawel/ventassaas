{% extends 'website/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4>{{ titulo }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Seleccionar Estudiante</label>
                    <select name="estudiante" class="form-select" required>
                        <option value="">-- Seleccione --</option>
                        {% for e in estudiantes %}
                        <option value="{{ e.id }}">{{ e.get_full_name }} ({{ e.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'lista_cursos' %}?anho={{ curso.anho_escolar.id }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Desinscribir de todas las materias</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
